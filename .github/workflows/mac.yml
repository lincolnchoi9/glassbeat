name: mac
on:
  push:
    branches: [main, 'mac-*']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: version
        run: echo "version=$(node -p "require('./frontend/package.json').version")" >> "$GITHUB_OUTPUT"
      # Compiler errors and test failures become annotations, readable without auth from the public check-runs API.
      - name: Bundle
        run: |
          set -o pipefail
          bash mac/scripts/bundle.sh 2>&1 | tee build.log || {
            bash mac/scripts/annotate.sh build.log
            echo "::error title=bundle.sh failed::$(tail -n 8 build.log | tr '\n' ' ' | cut -c1-900)"
            exit 1
          }
      - name: Test
        run: |
          set -o pipefail
          cd mac
          swift test 2>&1 | tee test.log || {
            bash scripts/annotate.sh test.log
            echo "::error title=swift test failed::$(grep -E 'error|failed' test.log | tail -n 6 | tr '\n' ' ' | cut -c1-900)"
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: PrismPlay-mac-${{ steps.version.outputs.version }}
          # The ditto zip keeps the executable bit and code signature, which a raw .app upload would lose.
          path: mac/build/PrismPlay-mac-*.zip
          if-no-files-found: error
